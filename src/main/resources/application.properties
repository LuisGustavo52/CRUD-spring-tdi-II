spring.application.name=Retromaster

# Configurações de datasource com suporte a MySQL e fallback para H2
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:retromasterdb}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Configurações de JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}

# Console H2 (apenas se rodar localmente com H2)
spring.h2.console.enabled=true

server.port=8081