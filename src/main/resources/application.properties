spring.application.name=Retromaster

# Estas configurações serão sobrescritas pelo Docker, 
# mas servem de fallback se rodar localmente sem contentor
spring.datasource.url=jdbc:h2:mem:retromasterdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Manter as suas configurações originais de JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Console H2 (apenas se rodar localmente com H2)
spring.h2.console.enabled=true

server.port=8081